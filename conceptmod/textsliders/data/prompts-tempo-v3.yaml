    negative: "Genre: ambient dub. BPM: 50. Immensely slow pulse, one drum hit every few seconds, long drifting pads, vocal lines drawn out endlessly."
    neutral: "Genre: electronic pop. BPM: 108. A programmed beat at a moderate clip, even pulse, comfortable groove."
    attributes: ["A man is singing.", "A woman is singing."]
