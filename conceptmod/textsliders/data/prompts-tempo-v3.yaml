    negative: "Genre: slowcore. BPM: 46. Glacial tempo, enormous gaps between drum hits, chords ringing out forever, each word stretched and suspended."
    neutral: "Genre: indie rock. BPM: 116. A band at a walking pace, steady backbeat, unhurried but moving."
    attributes: ["A man is singing.", "A woman is singing."]
    lyrics: "[verse]\nCity lights are burning through the rain\n[chorus]\nI keep moving on, I keep moving on"
