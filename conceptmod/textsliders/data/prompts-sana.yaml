# Sana 0.6B happy slider — UNI analog (opt-in cheap test backend).
#
# Happy is the example concept because age/old-face renders wander into
# uncanny artifacts. UNI analog is unchanged: plus+neu, unused tokens
# hold to encode(neu), concept words are not held.
#
# plus = happy, neu = person. Negative is a canary only (no minus teacher).
# attributes pin unused gender so the axis is emotion, not male/female.
# concept_words are not held; unused prompt tokens hold to encode(neu).
#
# Fruit-bowl is the conceptmod control prompt (outputs/01–13): the edit
# should leave it alone. It is not a teacher.
#
# Infer +1 with the neutral caption + trained xattn / LoRA, not the + caption.
plus_label: Happy
minus_label: Sad
recommended_range: [0.0, 2.0]
concept_words: "happy, smiling, joyful"
control_prompt: "a bowl of fruit on a table"
rows:
  - target: "a person"
    positive: "a happy person"
    negative: "a sad person"
    neutral: "a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
  - target: "a portrait of a person"
    positive: "a portrait of a happy person"
    negative: "a portrait of a sad person"
    neutral: "a portrait of a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
