# Sana 0.6B happy slider — UNI analog (opt-in cheap test backend).
#
# Stronger smile positives: stock Sana already smiles on these; weak
# "a happy person" plus was not enough for the slider to move expression.
# UNI: train/infer +1 on neu caption; + caption is CFG teacher only (#62).
#
# attributes pin unused gender. Fruit-bowl is control, not a teacher.
plus_label: Happy
minus_label: Sad
recommended_range: [0.0, 2.0]
concept_words: "smiling, happy, joyful, smile"
control_prompt: "a bowl of fruit on a table"
rows:
  - target: "a person"
    positive: "a person smiling, happy expression"
    negative: "a sad person"
    neutral: "a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
  - target: "a portrait of a person"
    positive: "a portrait of a person smiling, happy expression"
    negative: "a portrait of a sad person"
    neutral: "a portrait of a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
