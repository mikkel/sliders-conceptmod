# Sana 0.6B age slider — UNI analog (opt-in cheap test backend).
#
# plus = old, neu = person. Negative is a canary only (no minus teacher).
# attributes pin unused gender so the axis is age, not male/female.
# concept_words are not held; unused prompt tokens hold to encode(neu).
#
# Fruit-bowl is the conceptmod control prompt (outputs/01–13): the edit
# should leave it alone. It is not a teacher.
#
# Infer +1 with the neutral caption + trained xattn / LoRA, not the + caption.
plus_label: Old
minus_label: Young
recommended_range: [0.0, 2.0]
concept_words: "old, elderly, aged"
control_prompt: "a bowl of fruit on a table"
rows:
  - target: "a person"
    positive: "an old person"
    negative: "a young person"
    neutral: "a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
  - target: "a portrait of a person"
    positive: "a portrait of an old person"
    negative: "a portrait of a young person"
    neutral: "a portrait of a person"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
