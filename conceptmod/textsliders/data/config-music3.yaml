prompts_file: "conceptmod/textsliders/data/prompts-music3.yaml"
pretrained_model:
  name_or_path: "/ml2/music/models/MiniMax-Music3"
  v2: false
  v_pred: false
network:
  type: "lierla"
  rank: 8
  alpha: 8.0
  training_method: "full"
train:
  precision: "bfloat16"
  noise_scheduler: "builtin"
  iterations: 500
  lr: 0.0001
  optimizer: "AdamW"
  lr_scheduler: "cosine"
  max_denoising_steps: 30
save:
  name: "energy"
  path: "/ml2/music/sliders-conceptmod/models/energy-slider"
  per_steps: 80
  precision: "float32"
logging:
  use_wandb: false
  verbose: false
other:
  use_xformers: false
