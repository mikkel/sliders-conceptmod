prompts_file: "conceptmod/textsliders/data/prompts-zimage.yaml"
pretrained_model:
  name_or_path: "Tongyi-MAI/Z-Image-Turbo"
  v2: false
  v_pred: false
network:
  type: "lierla"
  rank: 16
  alpha: 16.0
  training_method: "full"
train:
  precision: "bfloat16"
  noise_scheduler: "builtin"
  iterations: 500
  lr: 0.0001
  optimizer: "AdamW"
  lr_scheduler: "cosine"
  resolution: 768
  sample_steps: 8
  sample_guidance: 0.0
save:
  name: "age-zit"
  path: "models/zimage-slider"
  per_steps: 100
  precision: "float32"
logging:
  use_wandb: false
  verbose: false
other:
  use_xformers: false
