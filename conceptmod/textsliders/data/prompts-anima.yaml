# Anima image slider — UNI + unused-token hold.
#
# positive / neutral. Unused attributes (indoor, portrait) are pinned and
# held to encode(neu). Concept word "smiling" is not held.
# No minus teacher. Do not copy Music 3 lyric / <|audio_start|> fields.
#
# Live train card: docs/anima-slider.md / scripts/smoke_anima_slider.py
plus_label: smiling
minus_label: ""
recommended_range: [-2.0, 2.0]
rows:
  - target: "a woman sitting on a chair"
    positive: "a smiling woman sitting on a chair"
    neutral: "a woman sitting on a chair"
    attributes:
      - indoor
      - portrait
    action: enhance
    guidance_scale: 4
    resolution: 768
    batch_size: 1
  - target: "a man reading at a table"
    positive: "a smiling man reading at a table"
    neutral: "a man reading at a table"
    attributes:
      - indoor
      - portrait
    action: enhance
    guidance_scale: 4
    resolution: 768
    batch_size: 1
