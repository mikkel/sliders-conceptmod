# Anima image slider — UNI + unused-token hold.
#
# Bare captions. Do NOT prefix attributes onto target / positive /
# neutral — that was the v3 train/sample mismatch (train saw
# "indoor a woman…", sample stripped to the bare infer/neu).
# attributes / pins stay for unused-token hold bookkeeping only.
# Student +1 and in-process pipe(prompt=...) share these strings.
#
# neu must not already smile (stock Anima soft-smiles on a bare
# "a woman sitting on a chair"). + is teacher only; student +1
# stays on neu/infer (#62 analog). Do not hold concept_words.
#
# Sana lesson: weak "happy" failed; a harder smile (teeth / joyful)
# gave the teacher a real gap. No minus teacher. Do not copy Music 3
# lyric / <|audio_start|> fields.
#
# Live train card: docs/anima-slider.md / scripts/smoke_anima_slider.py
plus_label: smiling
minus_label: ""
recommended_range: [-2.0, 2.0]
concept_words: "smiling, smile, happy, joyful, teeth"
rows:
  - target: "a woman sitting on a chair, neutral expression, closed mouth"
    positive: "a woman sitting on a chair, big smile showing teeth, happy joyful expression"
    neutral: "a woman sitting on a chair, neutral expression, closed mouth"
    attributes:
      - indoor
      - portrait
    action: enhance
    guidance_scale: 4
    resolution: 768
    batch_size: 1
  - target: "a man reading at a table, neutral expression, closed mouth"
    positive: "a man reading at a table, big smile showing teeth, happy joyful expression"
    neutral: "a man reading at a table, neutral expression, closed mouth"
    attributes:
      - indoor
      - portrait
    action: enhance
    guidance_scale: 4
    resolution: 768
    batch_size: 1
