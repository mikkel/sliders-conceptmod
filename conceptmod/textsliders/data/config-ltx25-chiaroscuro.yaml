prompts_file: "conceptmod/textsliders/data/prompts-ltx25-chiaroscuro.yaml"
pretrained_model:
  name_or_path: "Lightricks/LTX-2.5-Diffusers"
  transformer_subfolder: "transformer"
  transformer_full: "transformer_full"
  text_encoder: "gemma4_unified"
  stack: "ltx2_post_connector_video"
  cfg_distilled: true
  ignore_on_first_download:
    - transformer_full/*
network:
  type: "lierla"
  rank: 16
  alpha: 16.0
  lora_up_init_std: 0.02
  training_method: "attn"
  target: "te_last_n+video_connectors"
  hosts:
    - video_connectors
    - te_last_n
  te_last_n: 4
  linears:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  skip:
    - audio connectors
    - dit
    - attn1
    - attn2
  train_dit: false
  train_adaln: false
train:
  recipe: "ltx25_uni_embed"
  precision: "bfloat16"
  iterations: 700
  lr: 0.0002
  optimizer: "AdamW"
  hold_mode: "non_concept"
  hold_stage: "pre_connector"
  student_plus: "neu"
  embed_rel_l2_weight: 1.0
  num_frames: 9
  height: 32
  width: 32
  sample_num_frames: 49
  sample_height: 544
  sample_width: 960
  sample_scales: [-1.0, 0.0, 0.5, 1.0]
  guidance: 1.0
  stg_scale: 0
  modality_scale: 1.0
  sigmas: "DISTILLED_SIGMA_VALUES"
  prompt_enhancer: false
  decoder: "conv_vae"
  device: "cuda:0"
  encoder_device: "cuda:1"
  freeze:
    - transformer
    - vae
    - audio_vae
    - vocoder
    - tokenizer
    - processor
    - prompt_enhancer
    - duration_head
    - diffusion_decoder
save:
  name: "chiaro-ltx25-uni"
  path: "./models"
  per_steps: 100
  precision: "float32"
logging:
  use_wandb: false
  verbose: false
