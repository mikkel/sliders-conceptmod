# Krea UNI detailed slider — smile-krea-v4 TE-only embed UNI on a
# non-smile concept (fine detail / texture / intricacy).
#
# Bare captions. Do NOT prefix attributes onto target / positive /
# neutral (Anima v3 train/sample mismatch). attributes pin unused
# gender for hold bookkeeping only.
#
# Scenes show detail better than faces. Neu is simple / flat / plain
# so stock Krea is not already detailed (smile analog: closed-mouth).
# Plus is highly detailed, intricate textures, fine detail everywhere.
# Minus is a canary only — not a teacher.
#
# Train on krea/Krea-2-Raw (rank 16, 512 px, 28 steps).
# Official: train LoRAs on Raw, run on Turbo (8 steps, CFG 0).
# Accept entanglement; no same_crop / embed_struct.
plus_label: Detailed
minus_label: Simple
recommended_range: [0.0, 2.0]
concept_words: "detailed, intricate, textures, texture, fine, detail"
control_prompt: "a bowl of fruit on a table"
bare_captions: true
rows:
  - target: "a landscape, simple flat, plain"
    positive: "a landscape, highly detailed, intricate textures, fine detail everywhere"
    neutral: "a landscape, simple flat, plain"
    negative: "a washed-out blank featureless landscape"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
  - target: "an interior room, simple flat, plain"
    positive: "an interior room, highly detailed, intricate textures, fine detail everywhere"
    neutral: "an interior room, simple flat, plain"
    negative: "a washed-out blank featureless interior room"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
  - target: "an object on a table, simple flat, plain"
    positive: "an object on a table, highly detailed, intricate textures, fine detail everywhere"
    neutral: "an object on a table, simple flat, plain"
    negative: "a washed-out blank featureless object on a table"
    attributes: ["male", "female"]
    action: enhance
    guidance_scale: 4.5
    resolution: 512
    batch_size: 1
